<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Cpath%20d%3D%22M16%202C9.4%202%204%207.4%204%2014c0%204.5%202.3%208.5%205.8%2010.8L10%2027h12l.2-2.2C25.7%2022.5%2028%2018.5%2028%2014%2028%207.4%2022.6%202%2016%202z%22%20fill%3D%22%23C49A3C%22/%3E%3Cpath%20d%3D%22M16%204.5C11%204.5%207%208.5%207%2013.5c0%203.5%201.8%206.6%204.5%208.4L12%2025h8l.5-3.1C23.2%2020.1%2025%2017%2025%2013.5c0-5-4-9-9-9z%22%20fill%3D%22%23F0D870%22%20opacity%3D%22.8%22/%3E%3Cellipse%20cx%3D%2213.5%22%20cy%3D%2210.5%22%20rx%3D%223%22%20ry%3D%222%22%20fill%3D%22white%22%20opacity%3D%22.3%22/%3E%3Crect%20x%3D%2211%22%20y%3D%2227%22%20width%3D%2210%22%20height%3D%222.5%22%20rx%3D%22.4%22%20fill%3D%22%238B7035%22/%3E%3Crect%20x%3D%2212.5%22%20y%3D%2229.5%22%20width%3D%227%22%20height%3D%221.5%22%20rx%3D%22.4%22%20fill%3D%22%236A5220%22/%3E%3C/svg%3E" />
  <title>The Arena — Dialogues Across Time</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cormorant+Upright:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --void:        #0A090C;
      --deep:        #111018;
      --surface:     #1A1825;
      --surface-mid: #232135;
      --amber:       #C49A3C;
      --amber-dim:   #7A5E20;
      --amber-pale:  #E8C96A;
      --brass:       #8B7035;
      --ivory:       #EDE8D8;
      --ivory-dim:   #A09880;
      --steel:       #4A5568;
      --text:        #F0EDE4;
      --text-dim:    #C8C4B8;
      --left-glow:   rgba(196,154,60,0.15);
      --right-glow:  rgba(196,154,60,0.15);
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--void);
      color: var(--text);
      font-family: 'Cormorant Garamond', Georgia, serif;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* Grain overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.06'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
    }

    /* ── HEADER ── */
    header {
      padding: 1.2rem 3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(196,154,60,0.2);
      animation: fadeDown 0.8s ease both;
      position: relative;
      z-index: 100;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .back-link {
      font-family: 'Cinzel', serif;
      font-size: 0.52rem;
      letter-spacing: 0.35em;
      color: var(--ivory-dim);
      text-decoration: none;
      text-transform: uppercase;
      transition: color 0.2s;
      display: flex;
      align-items: center;
      gap: 0.5em;
    }

    .back-link:hover { color: var(--amber); }

    .header-label {
      font-family: 'Cinzel', serif;
      font-size: 0.58rem;
      letter-spacing: 0.4em;
      color: var(--amber);
      text-transform: uppercase;
      opacity: 0.95;
    }

    .header-nav {
      display: flex;
      gap: 1.5rem;
      align-items: center;
      position: relative;
    }

    .personas-dropdown-wrap { position: relative; }

    .personas-dropdown-btn {
      font-family: 'Cinzel', serif;
      font-size: 0.52rem;
      letter-spacing: 0.3em;
      color: var(--text-dim);
      background: transparent;
      border: 1px solid rgba(196,154,60,0.25);
      padding: 0.45rem 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 0.5em;
    }

    .personas-dropdown-btn:hover { border-color: var(--amber); color: var(--amber); }

    .personas-dropdown-menu {
      display: none;
      position: absolute;
      right: 0;
      top: calc(100% + 6px);
      background: var(--deep);
      border: 1px solid rgba(196,154,60,0.25);
      min-width: 220px;
      max-height: 360px;
      overflow-y: auto;
      z-index: 200;
      scrollbar-width: thin;
      scrollbar-color: rgba(196,154,60,0.2) transparent;
    }

    .personas-dropdown-menu.open { display: block; }

    .personas-dropdown-menu a {
      display: block;
      padding: 0.55rem 1rem;
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.88rem;
      color: var(--text-dim);
      text-decoration: none;
      transition: background 0.15s, color 0.15s;
      border-bottom: 1px solid rgba(196,154,60,0.08);
    }

    .personas-dropdown-menu a:hover { background: rgba(196,154,60,0.07); color: var(--ivory); }

    /* ── HERO / SETUP SCREEN ── */
    #setup-screen {
      min-height: calc(100vh - 60px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem 2rem;
      position: relative;
      overflow: hidden;
    }

    #setup-screen::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(196,154,60,0.04) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 50%, rgba(196,154,60,0.04) 0%, transparent 60%),
        radial-gradient(ellipse at 50% 100%, rgba(196,154,60,0.06) 0%, transparent 50%);
      pointer-events: none;
    }

    #setup-screen::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 10%;
      right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(196,154,60,0.3), transparent);
    }

    .arena-title {
      text-align: center;
      margin-bottom: 1rem;
      animation: fadeIn 1s ease 0.2s both;
    }

    .arena-title .overline {
      font-family: 'Cinzel', serif;
      font-size: 0.6rem;
      letter-spacing: 0.5em;
      color: var(--amber);
      opacity: 0.6;
      text-transform: uppercase;
      display: block;
      margin-bottom: 1.2rem;
    }

    .arena-title h1 {
      font-family: 'Cinzel', serif;
      font-size: clamp(2.5rem, 6vw, 5rem);
      font-weight: 900;
      color: var(--ivory);
      letter-spacing: 0.08em;
      line-height: 1;
    }

    .arena-title h1 span { color: var(--amber); }

    .arena-title .subtitle {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(1rem, 2vw, 1.3rem);
      color: var(--text-dim);
      margin-top: 1rem;
      font-weight: 300;
      letter-spacing: 0.05em;
    }

    /* ── DIVIDER ORNAMENT ── */
    .ornament {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 2.5rem 0;
      width: 100%;
      max-width: 700px;
      animation: fadeIn 1s ease 0.4s both;
    }

    .ornament::before, .ornament::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(196,154,60,0.3), transparent);
    }

    .ornament span { font-size: 1rem; color: var(--amber); opacity: 0.4; }

    /* ── SETUP PANEL ── */
    .setup-panel {
      width: 100%;
      max-width: 900px;
      animation: fadeIn 1s ease 0.5s both;
    }

    /* Settings row above figure selector */
    .setup-settings-row {
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
      margin-bottom: 1rem;
      align-items: center;
    }

    .setting-toggle-group {
      display: flex;
      border: 1px solid rgba(196,154,60,0.2);
      overflow: hidden;
    }

    .setting-toggle-btn {
      font-family: 'Cinzel', serif;
      font-size: 0.48rem;
      letter-spacing: 0.25em;
      padding: 0.4rem 0.85rem;
      background: transparent;
      color: var(--text-dim);
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      border-right: 1px solid rgba(196,154,60,0.2);
    }

    .setting-toggle-btn:last-child { border-right: none; }

    .setting-toggle-btn.active {
      background: rgba(196,154,60,0.12);
      color: var(--amber-pale);
    }

    .setting-toggle-label {
      font-family: 'Cinzel', serif;
      font-size: 0.44rem;
      letter-spacing: 0.3em;
      color: var(--amber-dim);
      text-transform: uppercase;
      align-self: center;
      margin-right: 0.25rem;
    }

    /* Figure selector */
    .figure-selector {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 1.5rem;
      align-items: start;
      margin-bottom: 2.5rem;
    }

    .figure-slot {
      border: 1px solid rgba(196,154,60,0.2);
      background: var(--surface);
      padding: 1.8rem;
      position: relative;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .figure-slot:hover {
      border-color: rgba(196,154,60,0.4);
      box-shadow: 0 0 20px rgba(196,154,60,0.05);
    }

    .figure-slot::before {
      content: '';
      position: absolute;
      inset: 4px;
      border: 1px solid rgba(196,154,60,0.06);
      pointer-events: none;
    }

    .slot-label {
      font-family: 'Cinzel', serif;
      font-size: 0.55rem;
      letter-spacing: 0.35em;
      color: var(--amber-pale);
      opacity: 0.92;
      text-transform: uppercase;
      margin-bottom: 1rem;
      display: block;
    }

    .slot-select {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(196,154,60,0.3);
      color: var(--ivory);
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.2rem;
      font-style: italic;
      padding: 0.5rem 0;
      cursor: pointer;
      outline: none;
      appearance: none;
    }

    .slot-select option { background: var(--deep); color: var(--ivory); font-style: normal; }
    .slot-select:focus { border-bottom-color: var(--amber); }

    /* Figure preview inside slot */
    .figure-preview {
      display: none;
      margin-top: 1.2rem;
      padding-top: 1.2rem;
      border-top: 1px solid rgba(196,154,60,0.1);
      gap: 0.9rem;
      align-items: flex-start;
    }

    .figure-preview.visible {
      display: flex;
    }

    .preview-portrait {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 1px solid rgba(196,154,60,0.3);
      overflow: hidden;
      flex-shrink: 0;
      background: var(--surface-mid);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Cinzel', serif;
      font-size: 1rem;
      color: var(--amber);
    }

    .preview-portrait img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(90%) contrast(1.1); }

    .preview-info { flex: 1; min-width: 0; }

    .preview-years {
      font-family: 'Cinzel', serif;
      font-size: 0.5rem;
      letter-spacing: 0.2em;
      color: var(--amber);
      opacity: 0.6;
      margin-bottom: 0.35rem;
    }

    .preview-desc {
      font-size: 0.82rem;
      line-height: 1.55;
      color: var(--text-dim);
      font-style: italic;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .preview-trust {
      margin-top: 0.45rem;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    .trust-pip {
      width: 28px;
      height: 4px;
      background: rgba(196,154,60,0.15);
      border-radius: 2px;
      overflow: hidden;
    }

    .trust-pip-fill {
      height: 100%;
      border-radius: 2px;
      background: var(--amber);
      transition: width 0.4s ease;
    }

    .trust-score-text {
      font-family: 'Cinzel', serif;
      font-size: 0.44rem;
      letter-spacing: 0.2em;
      color: var(--amber-dim);
    }

    .vs-divider { text-align: center; padding-top: 1.8rem; }

    .vs-divider span {
      font-family: 'Cinzel', serif;
      font-size: 1.4rem;
      font-weight: 900;
      color: var(--amber);
      opacity: 0.80;
      letter-spacing: 0.2em;
    }

    /* Topic section */
    .topic-section { margin-bottom: 2.5rem; }

    .topic-label {
      font-family: 'Cinzel', serif;
      font-size: 0.58rem;
      letter-spacing: 0.35em;
      color: var(--amber-pale);
      opacity: 0.95;
      text-transform: uppercase;
      display: block;
      margin-bottom: 1rem;
    }

    .topic-input-wrap {
      position: relative;
      border: 1px solid rgba(196,154,60,0.55);
      background: var(--surface);
      margin-bottom: 1.2rem;
    }

    .topic-input {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--ivory);
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem;
      font-style: italic;
      padding: 1rem 1.2rem;
      outline: none;
    }

    .topic-input::placeholder { color: var(--ivory-dim); opacity: 0.85; }

    .suggested-topics { display: flex; flex-wrap: wrap; gap: 0.6rem; }

    .topic-chip {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.82rem;
      font-style: italic;
      color: var(--text);
      border: 1px solid rgba(196,154,60,0.40);
      padding: 0.4rem 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
      background: transparent;
    }

    .topic-chip:hover, .topic-chip.active {
      border-color: var(--amber);
      color: var(--amber-pale);
      background: rgba(196,154,60,0.05);
    }

    /* Begin button */
    .begin-btn {
      width: 100%;
      padding: 1.2rem;
      background: transparent;
      border: 1px solid var(--amber);
      color: var(--amber-pale);
      font-family: 'Cinzel', serif;
      font-size: 0.75rem;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
    }

    .begin-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--amber);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.3s ease;
      z-index: 0;
    }

    .begin-btn:hover::before { transform: scaleX(1); }
    .begin-btn:hover { color: var(--void); }
    .begin-btn span { position: relative; z-index: 1; }
    .begin-btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .begin-btn:disabled::before { display: none; }

    /* ── DEBATE ARENA ── */
    #debate-screen {
      display: none;
      min-height: calc(100vh - 60px);
      flex-direction: column;
    }

    #debate-screen.active { display: flex; }

    /* Stage header */
    .stage-header {
      padding: 1.2rem 2rem;
      border-bottom: 1px solid rgba(196,154,60,0.15);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--deep);
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .stage-topic {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1rem;
      color: var(--text-dim);
    }

    .stage-topic strong { color: var(--ivory); font-style: normal; font-weight: 400; }

    .stage-controls {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex-wrap: wrap;
    }

    /* Inline settings toggles in stage header */
    .stage-setting-group {
      display: flex;
      border: 1px solid rgba(196,154,60,0.18);
      overflow: hidden;
    }

    .stage-setting-btn {
      font-family: 'Cinzel', serif;
      font-size: 0.44rem;
      letter-spacing: 0.2em;
      padding: 0.38rem 0.7rem;
      background: transparent;
      color: var(--text-dim);
      border: none;
      border-right: 1px solid rgba(196,154,60,0.18);
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
    }

    .stage-setting-btn:last-child { border-right: none; }

    .stage-setting-btn.active {
      background: rgba(196,154,60,0.1);
      color: var(--amber-pale);
    }

    .btn-small {
      font-family: 'Cinzel', serif;
      font-size: 0.5rem;
      letter-spacing: 0.3em;
      padding: 0.5rem 1rem;
      border: 1px solid rgba(196,154,60,0.3);
      color: var(--text-dim);
      background: transparent;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
    }

    .btn-small:hover { border-color: var(--amber); color: var(--amber); }

    .btn-voice {
      display: inline-flex;
      align-items: center;
      gap: 0.4em;
      opacity: 0.5;
    }

    .btn-voice.active {
      opacity: 1;
      border-color: var(--amber);
      color: var(--amber);
    }

    /* Split stage */
    .split-stage {
      display: grid;
      grid-template-columns: 1fr 1fr;
      flex: 1;
      min-height: 0;
    }

    /* Individual podium */
    .podium {
      display: flex;
      flex-direction: column;
      padding: 2rem 1.8rem;
      border-right: 1px solid rgba(196,154,60,0.1);
      transition: background 0.5s ease, opacity 0.5s ease;
      position: relative;
      overflow: hidden;
    }

    .podium:last-child { border-right: none; }

    .podium.speaking { background: rgba(196,154,60,0.04); }

    .podium.speaking::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--amber), transparent);
      animation: scanline 2s ease infinite;
    }

    .podium.dormant { opacity: 0.45; }

    @keyframes scanline {
      0%   { opacity: 0; transform: scaleX(0); }
      50%  { opacity: 1; transform: scaleX(1); }
      100% { opacity: 0; transform: scaleX(1); }
    }

    /* Figure nameplate */
    .nameplate {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      margin-bottom: 1.5rem;
      padding-bottom: 1.2rem;
      border-bottom: 1px solid rgba(196,154,60,0.12);
    }

    .portrait-circle {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 1px solid rgba(196,154,60,0.3);
      overflow: hidden;
      flex-shrink: 0;
      background: var(--surface-mid);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Cinzel', serif;
      font-size: 1.2rem;
      color: var(--amber);
      opacity: 0.6;
    }

    .portrait-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(100%) contrast(1.1);
    }

    .nameplate-text { flex: 1; min-width: 0; }

    .figure-name {
      font-family: 'Cinzel', serif;
      font-size: 1rem;
      font-weight: 600;
      color: var(--ivory);
      letter-spacing: 0.05em;
    }

    .figure-years {
      font-family: 'Cormorant Upright', serif;
      font-size: 0.6rem;
      letter-spacing: 0.25em;
      color: var(--amber);
      opacity: 0.5;
      margin-top: 0.15rem;
    }

    /* Trust badge in nameplate */
    .nameplate-trust {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      margin-top: 0.4rem;
    }

    .trust-bar {
      width: 36px;
      height: 3px;
      background: rgba(196,154,60,0.15);
      border-radius: 2px;
      overflow: hidden;
    }

    .trust-bar-fill {
      height: 100%;
      border-radius: 2px;
      background: var(--amber);
    }

    .trust-text {
      font-family: 'Cinzel', serif;
      font-size: 0.42rem;
      letter-spacing: 0.18em;
      color: var(--amber-dim);
    }

    .speaking-indicator {
      margin-left: auto;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--amber);
      opacity: 0;
      transition: opacity 0.3s;
      box-shadow: 0 0 8px var(--amber);
      flex-shrink: 0;
    }

    .podium.speaking .speaking-indicator {
      opacity: 1;
      animation: pulse 1.5s ease infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    /* Response area */
    .response-area {
      flex: 1;
      overflow-y: auto;
      padding-right: 0.5rem;
      scrollbar-width: thin;
      scrollbar-color: rgba(196,154,60,0.2) transparent;
    }

    .response-area::-webkit-scrollbar { width: 3px; }
    .response-area::-webkit-scrollbar-track { background: transparent; }
    .response-area::-webkit-scrollbar-thumb { background: rgba(196,154,60,0.2); }

    .exchange {
      margin-bottom: 2rem;
      animation: fadeIn 0.6s ease both;
    }

    .exchange-number {
      font-family: 'Cinzel', serif;
      font-size: 0.5rem;
      letter-spacing: 0.3em;
      color: var(--amber);
      opacity: 0.45;
      margin-bottom: 0.6rem;
    }

    .phase-badge {
      font-family: 'Cinzel', serif;
      font-size: 0.52rem;
      letter-spacing: 0.35em;
      color: var(--amber);
      opacity: 0.5;
      text-transform: uppercase;
      padding: 0.3rem 0.8rem;
      border: 1px solid rgba(196,154,60,0.2);
      white-space: nowrap;
    }

    .exchange-text {
      font-size: 1rem;
      line-height: 1.85;
      color: var(--text);
      font-weight: 300;
    }

    /* Source toggle */
    .source-toggle-wrap {
      margin-top: 0.7rem;
    }

    .source-toggle-btn {
      font-family: 'Cinzel', serif;
      font-size: 0.46rem;
      letter-spacing: 0.2em;
      color: var(--amber-pale);
      background: transparent;
      border: 1px solid rgba(196,154,60,0.45);
      padding: 0.28rem 0.65rem;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      gap: 0.4em;
    }

    .source-toggle-btn:hover { border-color: rgba(232,201,106,0.75); color: var(--amber-pale); }

    .source-list {
      display: none;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-top: 0.5rem;
      padding-top: 0.5rem;
      border-top: 1px solid rgba(196,154,60,0.25);
    }

    .source-list.open { display: flex; }

    .source-item {
      font-family: 'Cinzel', serif;
      font-size: 0.46rem;
      letter-spacing: 0.06em;
      color: var(--text);
      background: rgba(196,154,60,0.1);
      border: 1px solid rgba(196,154,60,0.35);
      border-radius: 2px;
      padding: 0.2rem 0.45rem;
      white-space: nowrap;
    }

    .source-badge {
      font-size: 0.4rem;
      color: var(--text-dim);
      margin-left: 0.25rem;
      font-style: italic;
    }

    /* Confidence row under exchange */
    .confidence-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-top: 0.5rem;
    }

    .confidence-label {
      font-family: 'Cinzel', serif;
      font-size: 0.44rem;
      letter-spacing: 0.2em;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    .confidence-bar {
      width: 48px;
      height: 3px;
      background: rgba(196,154,60,0.12);
      border-radius: 2px;
      overflow: hidden;
    }

    .confidence-bar-fill {
      height: 100%;
      border-radius: 2px;
    }

    /* Typewriter cursor */
    .typing::after {
      content: '|';
      animation: blink 0.7s step-end infinite;
      color: var(--amber);
      opacity: 0.7;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 0; }
    }

    /* ── BOTTOM BAR ── */
    .debate-footer {
      border-top: 1px solid rgba(196,154,60,0.12);
      padding: 1.2rem 2rem;
      background: var(--deep);
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .moderator-input {
      flex: 1;
      background: var(--surface);
      border: 1px solid rgba(196,154,60,0.2);
      color: var(--ivory);
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.95rem;
      font-style: italic;
      padding: 0.7rem 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .moderator-input::placeholder { color: var(--text-dim); opacity: 0.4; }
    .moderator-input:focus { border-color: rgba(196,154,60,0.4); }

    .continue-btn {
      font-family: 'Cinzel', serif;
      font-size: 0.58rem;
      letter-spacing: 0.3em;
      padding: 0.75rem 1.8rem;
      border: 1px solid var(--amber);
      color: var(--amber-pale);
      background: transparent;
      cursor: pointer;
      transition: all 0.3s;
      text-transform: uppercase;
      white-space: nowrap;
      position: relative;
      overflow: hidden;
    }

    .continue-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--amber);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.3s;
      z-index: 0;
    }

    .continue-btn:hover::before { transform: scaleX(1); }
    .continue-btn:hover { color: var(--void); }
    .continue-btn span { position: relative; z-index: 1; }
    .continue-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .continue-btn:disabled::before { display: none; }

    /* Loading state */
    .loading-dots { display: none; gap: 4px; align-items: center; }
    .loading-dots.active { display: flex; }

    .loading-dots span {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--amber);
      animation: dotPulse 1.2s ease infinite;
    }

    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dotPulse {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .exchange-counter {
      font-family: 'Cinzel', serif;
      font-size: 0.52rem;
      letter-spacing: 0.2em;
      color: var(--text-dim);
      white-space: nowrap;
    }

    /* ── SUMMARY OVERLAY ── */
    #summary-panel {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10,9,12,0.88);
      z-index: 500;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      backdrop-filter: blur(4px);
    }

    #summary-panel.open { display: flex; }

    .summary-card {
      background: var(--deep);
      border: 1px solid rgba(196,154,60,0.3);
      max-width: 720px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      padding: 2.5rem;
      animation: fadeIn 0.4s ease both;
    }

    .summary-card-title {
      font-family: 'Cinzel', serif;
      font-size: 0.62rem;
      letter-spacing: 0.4em;
      color: var(--amber);
      text-transform: uppercase;
      margin-bottom: 1.8rem;
      opacity: 0.8;
    }

    .summary-figures {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-bottom: 1.8rem;
    }

    .summary-figure-col { border-top: 2px solid rgba(196,154,60,0.2); padding-top: 1rem; }

    .summary-figure-name {
      font-family: 'Cinzel', serif;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--ivory);
      letter-spacing: 0.06em;
      margin-bottom: 0.8rem;
    }

    .summary-exchange {
      margin-bottom: 1rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(196,154,60,0.08);
    }

    .summary-exchange:last-child { border-bottom: none; margin-bottom: 0; }

    .summary-exchange-label {
      font-family: 'Cinzel', serif;
      font-size: 0.44rem;
      letter-spacing: 0.25em;
      color: var(--amber-dim);
      text-transform: uppercase;
      margin-bottom: 0.35rem;
    }

    .summary-exchange-text {
      font-size: 0.88rem;
      line-height: 1.65;
      color: var(--text-dim);
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .summary-actions {
      display: flex;
      gap: 1rem;
      justify-content: flex-end;
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(196,154,60,0.12);
    }

    /* ── ANIMATIONS ── */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      header { padding: 1rem 1.2rem; }
      #setup-screen { padding: 2rem 1.2rem; }
      .figure-selector { grid-template-columns: 1fr; }
      .vs-divider { padding: 0.5rem 0; }
      .split-stage { grid-template-columns: 1fr; }
      .podium { border-right: none; border-bottom: 1px solid rgba(196,154,60,0.1); }
      .debate-footer { flex-wrap: wrap; }
      .moderator-input { min-width: 0; }
      .stage-header { flex-direction: column; gap: 1rem; padding: 1rem 1.2rem; }
      .summary-figures { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="header-left">
      <a href="https://museumofminds.com/" class="back-link">← Museum</a>
      <span class="header-label">The Arena &nbsp;·&nbsp; Debate Hall</span>
    </div>
    <nav class="header-nav">
      <div class="personas-dropdown-wrap">
        <button class="personas-dropdown-btn" onclick="togglePersonasMenu(this)">
          All Figures ▾
        </button>
        <div class="personas-dropdown-menu" id="personas-menu"></div>
      </div>
      <a href="founding-documents/" style="font-family:'Cinzel',serif;font-size:0.52rem;letter-spacing:0.3em;color:var(--text-dim);text-decoration:none;text-transform:uppercase;transition:color 0.2s;" onmouseover="this.style.color='var(--amber)'" onmouseout="this.style.color='var(--text-dim)'">Documents</a>
    </nav>
  </header>

  <!-- ══ SETUP SCREEN ══ -->
  <div id="setup-screen">

    <div class="arena-title">
      <span class="overline">Dialogues Across Time</span>
      <h1>The <span>Arena</span></h1>
      <p class="subtitle">Summon two minds. Choose the ground. Let them speak.</p>
    </div>

    <div class="ornament"><span>⚔</span></div>

    <div class="setup-panel">

      <!-- Settings row -->
      <div class="setup-settings-row">
        <span class="setting-toggle-label">Mode</span>
        <div class="setting-toggle-group">
          <button class="setting-toggle-btn active" id="setup-mode-hist" onclick="setSettingMode('historical', this)">Historical</button>
          <button class="setting-toggle-btn" id="setup-mode-mod" onclick="setSettingMode('modern', this)">Modern</button>
        </div>
        <span class="setting-toggle-label" style="margin-left:0.5rem;">Length</span>
        <div class="setting-toggle-group">
          <button class="setting-toggle-btn active" id="setup-len-std" onclick="setSettingLength('standard', this)">Standard</button>
          <button class="setting-toggle-btn" id="setup-len-brief" onclick="setSettingLength('brief', this)">Brief</button>
        </div>
        <span class="setting-toggle-label" style="margin-left:0.5rem;">Voice</span>
        <div class="setting-toggle-group">
          <button class="setting-toggle-btn active" id="setup-voice-off" onclick="setVoiceEnabled(false, this)">Off</button>
          <button class="setting-toggle-btn" id="setup-voice-on" onclick="setVoiceEnabled(true, this)">On</button>
        </div>
      </div>

      <!-- Figure Selector -->
      <div class="figure-selector">
        <div class="figure-slot">
          <span class="slot-label">First Mind</span>
          <select class="slot-select" id="figure-a" onchange="onFigureChange('a')">
            <option value="">— Select a figure —</option>
          
            <option value="george-mason">George Mason</option>
          </select>
          <div class="figure-preview" id="preview-a">
            <div class="preview-portrait" id="prev-portrait-a"></div>
            <div class="preview-info">
              <div class="preview-years" id="prev-years-a"></div>
              <div class="preview-desc" id="prev-desc-a"></div>
              <div class="preview-trust" id="prev-trust-a"></div>
            </div>
          </div>
        </div>

        <div class="vs-divider"><span>VS</span></div>

        <div class="figure-slot">
          <span class="slot-label">Second Mind</span>
          <select class="slot-select" id="figure-b" onchange="onFigureChange('b')">
            <option value="">— Select a figure —</option>
          
            <option value="george-mason">George Mason</option>
          </select>
          <div class="figure-preview" id="preview-b">
            <div class="preview-portrait" id="prev-portrait-b"></div>
            <div class="preview-info">
              <div class="preview-years" id="prev-years-b"></div>
              <div class="preview-desc" id="prev-desc-b"></div>
              <div class="preview-trust" id="prev-trust-b"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Topic -->
      <div class="topic-section">
        <span class="topic-label">The Question Before Them</span>
        <div class="topic-input-wrap">
          <input type="text" class="topic-input" id="topic-input" placeholder="Enter a topic or choose below..." />
        </div>
        <div class="suggested-topics" id="topic-chips"></div>
      </div>

      <!-- Begin -->
      <button class="begin-btn" id="begin-btn" onclick="beginDebate()" disabled>
        <span>Start Debate</span>
      </button>

    </div>
  </div>

  <!-- ══ DEBATE SCREEN ══ -->
  <div id="debate-screen">

    <!-- Stage header -->
    <div class="stage-header">
      <div class="stage-topic">
        On the question of: <strong id="stage-topic-display"></strong>
      </div>
      <div class="stage-controls">
        <div class="loading-dots" id="loading-dots">
          <span></span><span></span><span></span>
        </div>
        <span class="phase-badge" id="phase-badge">Opening</span>
        <span class="exchange-counter" id="exchange-counter">Exchange 0</span>

        <!-- Inline mode toggle -->
        <div class="stage-setting-group">
          <button class="stage-setting-btn active" id="stage-mode-hist" onclick="setStageMode('historical', this)">Hist.</button>
          <button class="stage-setting-btn" id="stage-mode-mod" onclick="setStageMode('modern', this)">Modern</button>
        </div>

        <!-- Inline length toggle -->
        <div class="stage-setting-group">
          <button class="stage-setting-btn active" id="stage-len-std" onclick="setStageLength('standard', this)">Std</button>
          <button class="stage-setting-btn" id="stage-len-brief" onclick="setStageLength('brief', this)">Brief</button>
        </div>

        <button class="btn-small btn-voice" id="voice-toggle" onclick="toggleVoice()" title="Enable voice">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
          Voice
        </button>
        <button class="btn-small" id="download-transcript-btn" onclick="downloadTranscript()" disabled title="Download transcript as PDF" style="display:none;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align:middle;margin-right:3px;">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>Transcript
        </button>
        <button class="btn-small" onclick="showSummary()">Summary</button>
        <button class="btn-small" onclick="resetArena()">New Debate</button>
      </div>
    </div>

    <!-- Split stage -->
    <div class="split-stage">

      <!-- Left podium -->
      <div class="podium dormant" id="podium-a">
        <div class="nameplate">
          <div class="portrait-circle" id="portrait-a">A</div>
          <div class="nameplate-text">
            <div class="figure-name" id="name-a">—</div>
            <div class="figure-years" id="years-a"></div>
            <div class="nameplate-trust" id="trust-a"></div>
          </div>
          <div class="speaking-indicator"></div>
        </div>
        <div class="response-area" id="responses-a"></div>
      </div>

      <!-- Right podium -->
      <div class="podium dormant" id="podium-b">
        <div class="nameplate">
          <div class="portrait-circle" id="portrait-b">B</div>
          <div class="nameplate-text">
            <div class="figure-name" id="name-b">—</div>
            <div class="figure-years" id="years-b"></div>
            <div class="nameplate-trust" id="trust-b"></div>
          </div>
          <div class="speaking-indicator"></div>
        </div>
        <div class="response-area" id="responses-b"></div>
      </div>

    </div>

    <!-- Footer controls -->
    <div class="debate-footer">
      <input
        type="text"
        class="moderator-input"
        id="moderator-input"
        placeholder="Steer the debate… or leave blank to continue"
      />
      <button class="continue-btn" id="continue-btn" onclick="continueDebate()">
        <span>Continue →</span>
      </button>
    </div>

  </div>

  <!-- ══ SUMMARY PANEL ══ -->
  <div id="summary-panel">
    <div class="summary-card">
      <div class="summary-card-title">Debate Summary</div>
      <div class="summary-figures" id="summary-figures"></div>
      <div class="summary-actions">
        <button class="btn-small" onclick="downloadTranscript()">Download PDF</button>
        <button class="btn-small" onclick="closeSummary()">Return to Debate</button>
        <button class="btn-small" onclick="resetArena()">New Debate</button>
      </div>
    </div>
  </div>

  <script>
    // ── PORTRAIT MAP ──
    const PORTRAIT_MAP = {
      'abraham-lincoln':        { initial: 'AL', portrait: 'https://upload.wikimedia.org/wikipedia/commons/thumb/a/ab/Abraham_Lincoln_O-77_matte_collodion_print.jpg/800px-Abraham_Lincoln_O-77_matte_collodion_print.jpg' },

      'franklin-d-roosevelt':   { initial: 'FR', portrait: 'https://upload.wikimedia.org/wikipedia/commons/thumb/4/42/FDR_1944_Color_Portrait.jpg/800px-FDR_1944_Color_Portrait.jpg' },
      'frederick-douglass':     { initial: 'FD', portrait: 'https://upload.wikimedia.org/wikipedia/commons/thumb/e/e6/Frederick_Douglass_portrait.jpg/800px-Frederick_Douglass_portrait.jpg' },
      'frederick-law-olmsted':  { initial: 'FO', portrait: 'https://upload.wikimedia.org/wikipedia/commons/thumb/8/81/Frederick_Law_Olmsted_-_c._1893.jpg/800px-Frederick_Law_Olmsted_-_c._1893.jpg' },
      'friedrich-hayek':        { initial: 'FH', portrait: 'https://upload.wikimedia.org/wikipedia/commons/thumb/0/0b/Friedrich_Hayek_portrait.jpg/800px-Friedrich_Hayek_portrait.jpg' },
      'george-orwell':          { initial: 'GO', portrait: 'https://upload.wikimedia.org/wikipedia/commons/thumb/7/7e/George_Orwell_press_photo.jpg/800px-George_Orwell_press_photo.jpg' },
      'george-washington':      { initial: 'GW', portrait: 'https://upload.wikimedia.org/wikipedia/commons/thumb/b/b6/Gilbert_Stuart_Williamstown_Portrait_of_George_Washington.jpg/800px-Gilbert_Stuart_Williamstown_Portrait_of_George_Washington.jpg' },
      'george-washington-carver': { initial: 'GC', portrait: 'https://upload.wikimedia.org/wikipedia/commons/thumb/b/b1/George_Washington_Carver_c1910_-_Restoration.jpg/800px-George_Washington_Carver_c1910_-_Restoration.jpg' },
      'grover-cleveland':       { initial: 'GC', portrait: 'https://upload.wikimedia.org/wikipedia/commons/thumb/5/5b/Grover_Cleveland_-_NARA_-_518139.jpg/800px-Grover_Cleveland_-_NARA_-_518139.jpg' },

    const API_URL = 'https://museum-api-production-8ce6.up.railway.app';

    // ── FETCH PERSONAS ──
    async function fetchPersonas() {
      try {
        const resp = await fetch(`${API_URL}/personas`);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();
        const sorted = (data.personas || []).sort((a, b) => a.display_name.localeCompare(b.display_name));
        PERSONAS = {};

        const selectA = document.getElementById('figure-a');
        const selectB = document.getElementById('figure-b');
        const menu    = document.getElementById('personas-menu');

        while (selectA.options.length > 1) selectA.remove(1);
        while (selectB.options.length > 1) selectB.remove(1);
        menu.innerHTML = '';

        sorted.forEach(p => {
          const pm = PORTRAIT_MAP[p.id] || {};
          const words = p.display_name.replace(/[^A-Za-z ]/g, ' ').trim().split(/\s+/).filter(Boolean);
          const initial = pm.initial || (words.length >= 2 ? words[0][0] + words[words.length - 1][0] : (words[0] || 'X').slice(0, 2)).toUpperCase();
          PERSONAS[p.id] = {
            name: p.display_name,
            years: p.years,
            initial,
            portrait: pm.portrait || null,
            trust_score: p.trust_score || 0,
            trust_label: p.trust_label || '',
            description: p.description || '',
            voice_enabled: p.voice_enabled || false,
          };

          selectA.add(new Option(p.display_name, p.id));
          selectB.add(new Option(p.display_name, p.id));

          const a = document.createElement('a');
          a.href = `https://museumofminds.com/${p.id}/`;
          a.textContent = p.display_name;
          a.target = '_blank';
          menu.appendChild(a);
        });

        // Pre-fill from URL params
        loadURLParams();
      } catch (err) {
        console.error('Failed to load personas:', err);
      }
    }

    // ── PERSONAS DROPDOWN ──
    function togglePersonasMenu(btn) {
      const menu = document.getElementById('personas-menu');
      menu.classList.toggle('open');
      document.addEventListener('click', function handler(e) {
        if (!btn.contains(e.target) && !menu.contains(e.target)) {
          menu.classList.remove('open');
          document.removeEventListener('click', handler);
        }
      });
    }

    // ── FIGURE PREVIEW ──
    function onFigureChange(slot) {
      const id = document.getElementById(`figure-${slot}`).value;
      updateFigurePreview(slot, id);
      updateDynamicTopics();
      validateSetup();
    }

    function updateFigurePreview(slot, id) {
      const preview = document.getElementById(`preview-${slot}`);
      if (!id || !PERSONAS[id]) {
        preview.classList.remove('visible');
        return;
      }
      const p = PERSONAS[id];
      const pm = PORTRAIT_MAP[id] || {};

      // Portrait
      const portraitEl = document.getElementById(`prev-portrait-${slot}`);
      if (pm.portrait) {
        portraitEl.innerHTML = `<img src="${pm.portrait}" alt="${p.name}" onerror="this.parentNode.textContent='${p.initial}'" />`;
      } else {
        portraitEl.textContent = p.initial;
      }

      document.getElementById(`prev-years-${slot}`).textContent = p.years;
      document.getElementById(`prev-desc-${slot}`).textContent = p.description || '';

      // Trust bar
      const trustEl = document.getElementById(`prev-trust-${slot}`);
      if (p.trust_score > 0) {
        const color = p.trust_score >= 80 ? '#C49A3C' : p.trust_score >= 40 ? '#8B9E6B' : '#7A8A9E';
        trustEl.innerHTML = `
          <div class="trust-pip"><div class="trust-pip-fill" style="width:${p.trust_score}%;background:${color};"></div></div>
          <span class="trust-score-text">${p.trust_score}/100</span>
        `;
      } else {
        trustEl.innerHTML = '';
      }

      preview.classList.add('visible');
    }

    // ── DYNAMIC TOPIC CHIPS ──
    function updateDynamicTopics() {
      const a = document.getElementById('figure-a').value;
      const b = document.getElementById('figure-b').value;
      const container = document.getElementById('topic-chips');
      container.innerHTML = '';

      let topics = DEFAULT_TOPICS.map(t => ({ label: t.label, full: t.full }));

      if (a && b) {
        const pairKey = [a, b].sort().join('|');
        const pairTopics = PAIR_TOPICS[pairKey];
        if (pairTopics) {
          topics = pairTopics.map(t => ({ label: t, full: t }))
                             .concat(topics.slice(0, 4));
        }
      }

      topics.forEach(t => {
        const btn = document.createElement('button');
        btn.className = 'topic-chip';
        btn.textContent = t.label;
        btn.onclick = () => selectTopic(btn, t.full);
        container.appendChild(btn);
      });
    }

    function selectTopic(el, topic) {
      document.querySelectorAll('.topic-chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      document.getElementById('topic-input').value = topic;
      validateSetup();
    }

    // ── SETTINGS ──
    function setSettingMode(mode, btn) {
      settings.mode = mode;
      ['setup-mode-hist', 'setup-mode-mod'].forEach(id => document.getElementById(id)?.classList.remove('active'));
      btn.classList.add('active');
      syncStageSettings();
    }

    function setSettingLength(length, btn) {
      settings.length = length;
      ['setup-len-std', 'setup-len-brief'].forEach(id => document.getElementById(id)?.classList.remove('active'));
      btn.classList.add('active');
      syncStageSettings();
    }

    function setStageMode(mode, btn) {
      settings.mode = mode;
      ['stage-mode-hist', 'stage-mode-mod'].forEach(id => document.getElementById(id)?.classList.remove('active'));
      btn.classList.add('active');
    }

    function setStageLength(length, btn) {
      settings.length = length;
      ['stage-len-std', 'stage-len-brief'].forEach(id => document.getElementById(id)?.classList.remove('active'));
      btn.classList.add('active');
    }

    function syncStageSettings() {
      const modeHist = document.getElementById('stage-mode-hist');
      const stageMod = document.getElementById('stage-mode-mod');
      if (settings.mode === 'historical') {
        modeHist?.classList.add('active');
        stageMod?.classList.remove('active');
      } else {
        modeHist?.classList.remove('active');
        stageMod?.classList.add('active');
      }
      const stageStd   = document.getElementById('stage-len-std');
      const stageBrief = document.getElementById('stage-len-brief');
      if (settings.length === 'standard') {
        stageStd?.classList.add('active');
        stageBrief?.classList.remove('active');
      } else {
        stageStd?.classList.remove('active');
        stageBrief?.classList.add('active');
      }
    }

    // ── URL PARAMS ──
    function updateURL() {
      const params = new URLSearchParams({
        a: state.figureA,
        b: state.figureB,
        t: state.topic,
        mode: settings.mode,
        length: settings.length,
      });
      window.history.replaceState({}, '', `?${params.toString()}`);
    }

    function loadURLParams() {
      const params = new URLSearchParams(window.location.search);
      const a = params.get('a');
      const b = params.get('b');
      const t = params.get('t');
      const mode   = params.get('mode');
      const length = params.get('length');

      if (mode && (mode === 'historical' || mode === 'modern')) {
        settings.mode = mode;
        const histBtn = document.getElementById('setup-mode-hist');
        const modBtn  = document.getElementById('setup-mode-mod');
        if (mode === 'historical') { histBtn?.classList.add('active'); modBtn?.classList.remove('active'); }
        else { histBtn?.classList.remove('active'); modBtn?.classList.add('active'); }
      }

      if (length && (length === 'standard' || length === 'brief')) {
        settings.length = length;
        const stdBtn   = document.getElementById('setup-len-std');
        const briefBtn = document.getElementById('setup-len-brief');
        if (length === 'standard') { stdBtn?.classList.add('active'); briefBtn?.classList.remove('active'); }
        else { stdBtn?.classList.remove('active'); briefBtn?.classList.add('active'); }
      }

      if (a && PERSONAS[a]) {
        document.getElementById('figure-a').value = a;
        updateFigurePreview('a', a);
      }
      if (b && PERSONAS[b]) {
        document.getElementById('figure-b').value = b;
        updateFigurePreview('b', b);
      }
      if (t) {
        document.getElementById('topic-input').value = t;
      }
      if ((a || b) && t) {
        updateDynamicTopics();
        validateSetup();
      }
    }

    // ── SETUP VALIDATION ──
    document.getElementById('figure-a').addEventListener('change', validateSetup);
    document.getElementById('figure-b').addEventListener('change', validateSetup);
    document.getElementById('topic-input').addEventListener('input', validateSetup);

    function validateSetup() {
      const a = document.getElementById('figure-a').value;
      const b = document.getElementById('figure-b').value;
      const t = document.getElementById('topic-input').value.trim();
      document.getElementById('begin-btn').disabled = !(a && b && a !== b && t);

    // ── VOICE ──
    function setVoiceEnabled(on, btn) {
      state.voiceEnabled = on;
      ['setup-voice-off', 'setup-voice-on'].forEach(id => document.getElementById(id)?.classList.remove('active'));
      btn.classList.add('active');
      const stageBtn = document.getElementById('voice-toggle');
      stageBtn.classList.toggle('active', on);
      stageBtn.title = on ? 'Voice on — click to mute' : 'Enable voice';
    }

    function toggleVoice() {
      state.voiceEnabled = !state.voiceEnabled;
      const btn = document.getElementById('voice-toggle');
      btn.classList.toggle('active', state.voiceEnabled);
      btn.title = state.voiceEnabled ? 'Voice on — click to mute' : 'Enable voice';
      document.getElementById('setup-voice-off')?.classList.toggle('active', !state.voiceEnabled);
      document.getElementById('setup-voice-on')?.classList.toggle('active', state.voiceEnabled);
    }

    function playAudio(base64) {
      if (!base64) return Promise.resolve();
      return new Promise(resolve => {
        const audio = new Audio(`data:audio/mpeg;base64,${base64}`);
        audio.onended  = resolve;
        audio.onerror  = resolve;
        audio.play().catch(err => { console.warn('Audio blocked:', err); resolve(); });
      });
    }

    // ── BEGIN DEBATE ──
    function beginDebate() {
      state.figureA = document.getElementById('figure-a').value;
      state.figureB = document.getElementById('figure-b').value;
      state.topic   = document.getElementById('topic-input').value.trim();
      state.history = [];
      state.exchangeCount = 0;
      state.seenChunkIds  = [];

      const pA = PERSONAS[state.figureA];
      const pB = PERSONAS[state.figureB];

      document.getElementById('stage-topic-display').textContent = state.topic;
      document.getElementById('name-a').textContent  = pA.name;
      document.getElementById('years-a').textContent = pA.years;
      document.getElementById('name-b').textContent  = pB.name;
      document.getElementById('years-b').textContent = pB.years;

      setPortrait('portrait-a', pA);
      setPortrait('portrait-b', pB);
      setNameplateTrust('trust-a', pA);
      setNameplateTrust('trust-b', pB);

      document.getElementById('responses-a').innerHTML = '';
      document.getElementById('responses-b').innerHTML = '';

      syncStageSettings();
      updateURL();

      document.getElementById('setup-screen').style.display = 'none';
      document.getElementById('debate-screen').classList.add('active');

      runExchange();
    }

    function setPortrait(id, persona) {
      const el = document.getElementById(id);
      if (persona.portrait) {
        const img = document.createElement('img');
        img.src = persona.portrait;
        img.onerror = () => { el.innerHTML = persona.initial; };
        el.innerHTML = '';
        el.appendChild(img);
      } else {
        el.textContent = persona.initial;
      }
    }

    function setNameplateTrust(id, persona) {
      const el = document.getElementById(id);
      if (!el) return;
      if (persona.trust_score > 0) {
        const color = persona.trust_score >= 80 ? '#C49A3C' : persona.trust_score >= 40 ? '#8B9E6B' : '#7A8A9E';
        el.innerHTML = `
          <div class="trust-bar"><div class="trust-bar-fill" style="width:${persona.trust_score}%;background:${color};"></div></div>
          <span class="trust-text">${persona.trust_score}/100 corpus</span>
        `;
      } else {
        el.innerHTML = '';
      }
    }

    // ── PHASE LABELS ──
    function getPhaseLabel(n) {
      if (n === 1) return 'Opening';
      if (n === 2) return 'Argument';
      if (n <= 4)  return 'The Debate';
      return 'Cross-Examination';
    }

    function getExchangeLabel(n) {
      if (n === 1) return 'Opening Statement';
      return `Exchange ${n}`;
    }

    // ── RUN EXCHANGE ──
    async function runExchange() {
      if (state.isLoading) return;
      state.isLoading = true;
      state.exchangeCount++;

      const continueBtn = document.getElementById('continue-btn');
      const loadingDots = document.getElementById('loading-dots');
      const modInput    = document.getElementById('moderator-input');
      const steer       = modInput.value.trim();

      continueBtn.disabled = true;
      loadingDots.classList.add('active');
      document.getElementById('exchange-counter').textContent = `Exchange ${state.exchangeCount}`;
      document.getElementById('phase-badge').textContent = getPhaseLabel(state.exchangeCount);

      setSpeaking('a');

      try {
        const endpoint = state.voiceEnabled ? `${API_URL}/debate/voice` : `${API_URL}/debate`;
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            persona_a:      state.figureA,
            persona_b:      state.figureB,
            topic:          state.topic,
            history:        state.history,
            steer:          steer || null,
            exchange_num:   state.exchangeCount,
            seen_chunk_ids: state.seenChunkIds,
            mode:           settings.mode,
            length:         settings.length,
          })
        });

        if (!response.ok) throw new Error('Debate API error');
        const data = await response.json();

        if (data.chunk_ids?.length) {
          state.seenChunkIds = [...new Set([...state.seenChunkIds, ...data.chunk_ids])];
        }

        // Figure A — typewriter + audio run in parallel; wait for both to finish before B starts
        await Promise.all([
          typeResponse('responses-a', data.response_a, state.exchangeCount),
          state.voiceEnabled ? playAudio(data.audio_a) : Promise.resolve(),
        ]);
        if (data.sources_a?.length) renderSources('responses-a', data.sources_a, state.figureA);

        setSpeaking('b');
        await sleep(600);

        // Figure B — same pattern
        await Promise.all([
          typeResponse('responses-b', data.response_b, state.exchangeCount),
          state.voiceEnabled ? playAudio(data.audio_b) : Promise.resolve(),
        ]);
        if (data.sources_b?.length) renderSources('responses-b', data.sources_b, state.figureB);

        state.history.push({
          exchange: state.exchangeCount,
          figure_a: data.response_a,
          figure_b: data.response_b,
        });

        enableTranscriptBtn();
        modInput.value = '';

      } catch (err) {
        console.error(err);
        appendError('responses-a', 'The connection to the archive was lost. Please try again.');
      }

      setSpeaking(null);
      continueBtn.disabled = false;
      loadingDots.classList.remove('active');
      state.isLoading = false;
    }

    function continueDebate() { runExchange(); }

    // ── UI HELPERS ──
    function setSpeaking(side) {
      const podA = document.getElementById('podium-a');
      const podB = document.getElementById('podium-b');
      podA.classList.remove('speaking', 'dormant');
      podB.classList.remove('speaking', 'dormant');
      if (side === 'a') { podA.classList.add('speaking'); podB.classList.add('dormant'); }
      else if (side === 'b') { podB.classList.add('speaking'); podA.classList.add('dormant'); }
      else { podA.classList.add('dormant'); podB.classList.add('dormant'); }
    }

    async function typeResponse(containerId, text, exchangeNum) {
      const container = document.getElementById(containerId);
      const exchangeEl = document.createElement('div');
      exchangeEl.className = 'exchange';

      const numEl = document.createElement('div');
      numEl.className = 'exchange-number';
      numEl.textContent = getExchangeLabel(exchangeNum);

      const textEl = document.createElement('div');
      textEl.className = 'exchange-text typing';

      exchangeEl.appendChild(numEl);
      exchangeEl.appendChild(textEl);
      container.appendChild(exchangeEl);

      const words = text.split(' ');
      let rendered = '';
      for (let i = 0; i < words.length; i++) {
        rendered += (i === 0 ? '' : ' ') + words[i];
        textEl.textContent = rendered;
        container.scrollTop = container.scrollHeight;
        await sleep(28 + Math.random() * 18);
      }

      textEl.classList.remove('typing');
    }

    function appendError(containerId, message) {
      const container = document.getElementById(containerId);
      const el = document.createElement('div');
      el.className = 'exchange';
      el.innerHTML = `<div class="exchange-text" style="color:rgba(196,154,60,0.4);font-style:italic;">${message}</div>`;
      container.appendChild(el);
    }

    function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

    function enableTranscriptBtn() {
      const btn = document.getElementById('download-transcript-btn');
      if (btn) { btn.style.display = ''; btn.disabled = false; }
    }

    function renderSources(containerId, sources, personaId) {
      const container = document.getElementById(containerId);
      if (!container || !sources.length) return;

      const seen = new Set();
      const unique = sources.filter(s => {
        const key = `${s.title}|${s.year}`;
        if (seen.has(key) || !s.title) return false;
        seen.add(key);
        return true;
      });
      if (!unique.length) return;

      const persona = PERSONAS[personaId] || {};
      const score   = persona.trust_score || 0;
      const color   = score >= 80 ? '#C49A3C' : score >= 40 ? '#8B9E6B' : '#7A8A9E';

      const wrap = document.createElement('div');
      wrap.className = 'source-toggle-wrap';

      const toggleId = `src-${containerId}-${Date.now()}`;

      // Confidence row + toggle button
      const confRow = document.createElement('div');
      confRow.className = 'confidence-row';
      if (score > 0) {
        confRow.innerHTML = `
          <span class="confidence-label">Corpus</span>
          <div class="confidence-bar"><div class="confidence-bar-fill" style="width:${score}%;background:${color};"></div></div>
          <span class="confidence-label">${score}/100</span>
        `;
      }

      const btn = document.createElement('button');
      btn.className = 'source-toggle-btn';
      btn.innerHTML = `▸ Sources (${unique.length})`;
      btn.onclick = () => {
        const list = document.getElementById(toggleId);
        const open = list.classList.toggle('open');
        btn.innerHTML = open ? `▾ Sources (${unique.length})` : `▸ Sources (${unique.length})`;
      };

      const list = document.createElement('div');
      list.className = 'source-list';
      list.id = toggleId;
      list.innerHTML = unique.map(s => {
        const label = s.year ? `${s.title} (${s.year})` : s.title;
        const badge = s.type === 'discourse' ? ' <span class="source-badge">discourse</span>' : '';
        return `<span class="source-item">${label}${badge}</span>`;
      }).join('');

      confRow.appendChild(btn);
      wrap.appendChild(confRow);
      wrap.appendChild(list);
      container.appendChild(wrap);
    }

    // ── SUMMARY ──
    function showSummary() {
      if (!state.history.length) return;
      const nameA = PERSONAS[state.figureA]?.name || state.figureA;
      const nameB = PERSONAS[state.figureB]?.name || state.figureB;

      let colA = `<div class="summary-figure-name">${nameA}</div>`;
      let colB = `<div class="summary-figure-name">${nameB}</div>`;

      state.history.forEach((entry, i) => {
        const label = i === 0 ? 'Opening Statement' : `Exchange ${i + 1}`;
        colA += `<div class="summary-exchange">
          <div class="summary-exchange-label">${label}</div>
          <div class="summary-exchange-text">${escapeHtml(entry.figure_a)}</div>
        </div>`;
        colB += `<div class="summary-exchange">
          <div class="summary-exchange-label">${label}</div>
          <div class="summary-exchange-text">${escapeHtml(entry.figure_b)}</div>
        </div>`;
      });

      document.getElementById('summary-figures').innerHTML = `
        <div class="summary-figure-col">${colA}</div>
        <div class="summary-figure-col">${colB}</div>
      `;
      document.getElementById('summary-panel').classList.add('open');
    }

    function closeSummary() {
      document.getElementById('summary-panel').classList.remove('open');
    }

    function resetArena() {
      closeSummary();
      const dlBtn = document.getElementById('download-transcript-btn');
      if (dlBtn) { dlBtn.style.display = 'none'; dlBtn.disabled = true; }
      state = { figureA: null, figureB: null, topic: '', history: [], exchangeCount: 0, isLoading: false, voiceEnabled: false, seenChunkIds: [] };
      document.getElementById('debate-screen').classList.remove('active');
      document.getElementById('setup-screen').style.display = 'flex';
      document.querySelectorAll('.topic-chip').forEach(c => c.classList.remove('active'));
      document.getElementById('topic-input').value = '';
      document.getElementById('figure-a').value = '';
      document.getElementById('figure-b').value = '';
      document.getElementById('begin-btn').disabled = true;
      document.getElementById('phase-badge').textContent = 'Opening';
      document.getElementById('exchange-counter').textContent = 'Exchange 0';
      document.getElementById('voice-toggle').classList.remove('active');
      document.getElementById('setup-voice-off')?.classList.add('active');
      document.getElementById('setup-voice-on')?.classList.remove('active');
      document.getElementById('preview-a').classList.remove('visible');
      document.getElementById('preview-b').classList.remove('visible');
      state.voiceEnabled = false;
      window.history.replaceState({}, '', window.location.pathname);
    }

    // ── PDF TRANSCRIPT ──
    function downloadTranscript() {
      if (!state.history.length) return;
      const nameA = PERSONAS[state.figureA]?.name || state.figureA;
      const nameB = PERSONAS[state.figureB]?.name || state.figureB;
      const topic = state.topic;
      const date  = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });

      const styles = `
        body { font-family: Georgia, serif; color: #1a1a1a; margin: 0; padding: 20px 32px; font-size: 13px; line-height: 1.65; }
        .pdf-header { border-bottom: 2px solid #1a2332; padding-bottom: 12px; margin-bottom: 28px; }
        .pdf-title { font-size: 20px; font-weight: bold; color: #1a2332; margin: 0 0 4px; }
        .pdf-sub { font-size: 12px; color: #555; margin: 0 0 2px; }
        .pdf-meta { font-size: 10px; color: #999; font-style: italic; }
        .pdf-exchange { margin-bottom: 28px; page-break-inside: avoid; }
        .pdf-exchange-label { font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: #999; margin-bottom: 14px; border-top: 1px solid #eee; padding-top: 10px; }
        .pdf-speaker { display: block; margin-bottom: 12px; }
        .pdf-speaker-name { font-size: 10px; text-transform: uppercase; letter-spacing: 0.6px; color: #888; display: block; margin-bottom: 4px; }
        .pdf-speaker-a .pdf-speaker-name { color: #2a4a6e; }
        .pdf-speaker-b .pdf-speaker-name { color: #4a2a1e; }
        .pdf-text { white-space: pre-wrap; }
        .pdf-footer { border-top: 1px solid #ddd; margin-top: 30px; padding-top: 8px; font-size: 9px; color: #aaa; text-align: center; }
      `;

      let html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><style>${styles}</style></head><body>`;
      html += `<div class="pdf-header">
        <div class="pdf-title">Debate Transcript</div>
        <div class="pdf-sub">${nameA} vs. ${nameB}</div>
        <div class="pdf-sub" style="font-style:italic;color:#555;">"${topic}"</div>
        <div class="pdf-meta">Museum of Minds · ${date} · ${settings.mode === 'historical' ? 'Historical Voice' : 'Modern Awareness'} · ${settings.length === 'brief' ? 'Brief' : 'Standard'} length</div>
      </div>`;

      state.history.forEach((entry, i) => {
        const label = i === 0 ? 'Opening Statement' : `Exchange ${i + 1}`;
        html += `<div class="pdf-exchange">
          <div class="pdf-exchange-label">${label}</div>
          <div class="pdf-speaker pdf-speaker-a">
            <span class="pdf-speaker-name">${nameA}</span>
            <span class="pdf-text">${escapeHtml(entry.figure_a)}</span>
          </div>
          <div class="pdf-speaker pdf-speaker-b" style="margin-top:14px;">
            <span class="pdf-speaker-name">${nameB}</span>
            <span class="pdf-text">${escapeHtml(entry.figure_b)}</span>
          </div>
        </div>`;
      });

      html += `<div class="pdf-footer">Generated from Museum of Minds · museumofminds.com</div></body></html>`;

      const win = window.open('', '_blank', 'width=820,height=700');
      if (!win) { alert('Allow popups to download the transcript.'); return; }
      win.document.write(html);
      win.document.close();
      win.focus();
      setTimeout(() => { win.print(); }, 400);
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // ── INIT ──
    updateDynamicTopics();
    fetchPersonas();
  </script>

</body>
</html>
